# Checks that public/data/<release>/ is what the previous release and the released
# changesets build, that the pending changesets in changesets/next/ have nothing that
# blocks a merge (D51, D60, S3), and that the changeset tests pass. Deploys don't wait
# on it, but the site build fails on a pending changeset that isn't valid TOML or a
# changeset, or that updates or removes a missing row (src/ChangesetLoader.ts), so a
# PR's preview fails too. A pending value outside the codebook fails only here.
name: Data check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # the scripts run TypeScript directly with Node, which strips types from 22.18 on
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run test:changesets

      - run: npm run test:site

      - name: Check the release data and the pending changesets
        run: |
          set +e
          npm run --silent data:check 2>&1 | tee data-check.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            headline="data:check passed"
          else
            headline="data:check failed"
          fi
          {
            echo "## ${headline}"
            echo
            echo '```'
            cat data-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
