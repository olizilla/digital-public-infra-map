# Checks each proposal, an issue with the `proposal` label (D56, D86, D87), and keeps one comment on it
# up to date saying what the proposal would do, or what stops it applying (D88). It never says a
# proposal is valid or approved: accepting one is a person's call, by closing the issue as completed,
# which .github/workflows/proposal-accept.yml acts on (D88).
#
# The issue's body is data. scripts/proposal-check.ts reads it from the event's file ($GITHUB_EVENT_PATH),
# takes the first ```toml block under "### Changeset" (or the first anywhere) as text, and checks it as
# data:check-next would check it as one more pending changeset (scripts/release-build.ts). Nothing from
# the issue is put in a shell command or a ${{ }} expression, nothing from it is run, and only the
# default branch is checked out. scripts/proposal-comment.ts writes the comment, escaping every text.
#
# The comment starts with a hidden marker, <!-- dpimap-proposal-check sha256=<hex> checked=<time> -->,
# by which the next run finds and edits it, so there's one. It records the SHA-256 of the TOML it
# checked, and when, which accepting the proposal checks (D88). `needs-changes` is added when the
# proposal can't be applied as it is, and removed when it can. The workflow creates the label if it
# isn't there.
name: Proposal check

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  proposal-check:
    # proposals only, and of the labels added, only `proposal`: the workflow's own needs-changes doesn't
    # start a run, as the built-in token's events don't, but a maintainer's accepted would
    if: contains(github.event.issue.labels.*.name, 'proposal') && (github.event.action != 'labeled' || github.event.label.name == 'proposal')
    # one run per issue: a newer edit cancels an older check
    concurrency:
      group: proposal-check-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # the scripts run TypeScript directly with Node, which strips types from 22.18 on
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # the body is read from the event's file by the script, never through the shell
      - name: Check the proposal
        run: |
          node scripts/proposal-check.ts --event "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/proposal.json"
          node scripts/proposal-comment.ts "$RUNNER_TEMP/proposal.json" > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment, and label needs-changes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RESULT: ${{ runner.temp }}/proposal.json
          COMMENT: ${{ runner.temp }}/comment.md
        with:
          script: |
            const fs = require('node:fs')
            const result = JSON.parse(fs.readFileSync(process.env.RESULT, 'utf8'))
            const body = fs.readFileSync(process.env.COMMENT, 'utf8')
            // the marker's start: with a fingerprint, or without, as in comments from before it had one
            const marker = '<!-- dpimap-proposal-check '
            const { owner, repo } = context.repo
            const issue_number = context.issue.number

            // this workflow's own comment: the built-in token's, starting with the marker
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const mine = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker))
            if (!mine) await github.rest.issues.createComment({ owner, repo, issue_number, body })
            else if (mine.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })

            const name = 'needs-changes'
            if (!result.applies) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name })
              } catch (error) {
                if (error.status !== 404) throw error
                await github.rest.issues.createLabel({ owner, repo, name, color: 'd93f0b', description: 'A proposal that can’t be applied as it is' })
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] })
            } else {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name })
              } catch (error) {
                // it didn't have the label
                if (error.status !== 404) throw error
              }
            }
