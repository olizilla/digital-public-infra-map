values.system_type = "Interbank"
reason = "Instant UAH credit transfers between accounts at SEP participants (banks, the State Treasury, non-bank PSPs via banks); no mobile money, card or CBDC domain connected. Primary source: NBU, SEP instant transfers page: SEP 4.1 with instant credit transfers launched December 2024; processed at any time of day; final within 10 seconds; QR codes for payment details. Secondary source: Ukrainian News (14 Jan 2026), reporting NBU: 35.9 million instant transfers worth UAH 163.1 billion through SEP in 2025; all SEP participants must offer the service from 1 April 2026; SEP had 61 banks, the NBU, the State Treasury and three non-bank providers (via banks) on 1 Jan 2026."
sources = [
  "https://bank.gov.ua/en/payments/ips",
  "https://ukranews.com/en/news/1128373-number-of-payments-via-sep-increases-by-almost-quarter-to-595-million-in-2025",
]

