[[changes]]
type = "create"
key = "pay-ua-02"
as_of = 2026-10-15
values.country = "Ukraine"
values.name = "SEP instant credit transfers (System of Electronic Payments of the NBU)"
reason = "Replaces TIPS, the Eurosystem service, which was named in error. Ukraine's instant credit transfers run in the NBU's System of Electronic Payments (SEP 4.1) since December 2024. Primary source: NBU, SEP instant transfers page: SEP 4.1 with instant credit transfers launched December 2024; processed at any time of day; final within 10 seconds; QR codes for payment details. Secondary source: Ukrainian News (Dec 2024), reporting NBU: instant transfers from 1 Dec 2024 for all SEP participants (banks, non-bank PSPs, State Treasury); 10 banks at launch; limit UAH 100,000; SEP is an RTGS system, NBU is operator and settlement bank."
sources = [
  "https://bank.gov.ua/en/payments/ips",
  "https://ukranews.com/en/news/1050659-sep-4-1-with-instant-transfer-functionality-launched-in-december-nbu",
]

