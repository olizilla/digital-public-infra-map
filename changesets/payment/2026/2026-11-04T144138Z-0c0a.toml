[[changes]]
type = "update"
key = "pay-ci-01"
as_of = 2026-10-15
values.data_handling_rules = "Yes"
reason = "BCEAO Instruction No. 001-01-2024 on payment services in the WAMU limits payment service providers to the personal data needed to provide the service and requires explicit consent for other uses (Art. 50), and requires data security checks on outsourced providers (Art. 36). Primary source: BCEAO Instruction No. 001-01-2024."
sources = [
  "https://bceao.int/sites/default/files/inline-files/Instruction-No001-01-2024_relative_aux_services_de_paiement_dans_l-UMOA.pdf",
]

[[changes]]
type = "update"
key = "pay-ci-01"
as_of = 2026-10-15
values.reporting_forum = "No"
reason = "No forum connected to PI-SPI. Under BCEAO Instruction No. 001-01-2024 (Art. 51) users complain to their provider, which must reply within seven working days, then may complain to the WAMU Banking Commission, use mediation or the national Observatory for the Quality of Financial Services; these are general financial sector routes. Primary source: BCEAO Instruction No. 001-01-2024."
sources = [
  "https://bceao.int/sites/default/files/inline-files/Instruction-No001-01-2024_relative_aux_services_de_paiement_dans_l-UMOA.pdf",
]

[[changes]]
type = "update"
key = "pay-ci-01"
as_of = 2026-10-15
values.aml_law = "Yes"
reason = "Uniform Law on AML/CFT/proliferation financing (March 2023 version) applies across WAMU member states once transposed nationally; earlier uniform law versions were adopted by all eight states. Add the national transposing law if needed. Primary source: BCEAO, Loi uniforme LBC/FT/FP (2023)."
sources = [
  "https://bceao.int/sites/default/files/2025-02/Loi-uniforme-LBCFTFP-Mars-2023-vf.pdf",
]

[[changes]]
type = "update"
key = "pay-ci-01"
as_of = 2026-10-15
values.transaction_cost = "Cumulative transactions up to a limit of 8,000 CFA francs per day free. Any amount over this daily limit is subject to a fee capped at 0.8%"
reason = "From 2 November 2026, e-money transfers between individuals are free up to XOF 8,000 cumulative per user per day; above that, providers may charge up to 0.8% excluding tax. Receiving is free. Secondary source: Agence Ecofin (5 Oct 2026)."
sources = [
  "https://www.ecofinagency.com/news/0510-59462-wave-joins-pi-spi-as-bceao-rewrites-instant-payment-fee-rules",
]

