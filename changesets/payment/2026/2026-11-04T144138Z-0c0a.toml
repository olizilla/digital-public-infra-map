[[changes]]
type = "update"
key = "pay-ci-01"
as_of = 2026-10-15
values.participation_rules = "Yes"
reason = "Connection to PI-SPI is mandatory for banks, e-money institutions, payment institutions and microfinance institutions supervised by the WAMU Banking Commission, with membership agreements and technical certification; the BCEAO extended the deadline to 30 September 2026 for banks, e-money and payment institutions and to 30 June 2027 for microfinance institutions. Primary source: BCEAO communiqué (25 Jun 2026). Secondary source: Droit Medias Finance on the BCEAO circular setting the original 30 June 2026 deadline."
sources = [
  "https://www.bceao.int/sites/default/files/2026-06/Communiqu%C3%A9_Prolongation_d%C3%A9lai_Connexion_%C3%A0_PI-SPI-25062026.pdf",
  "https://droitmediasfinance.com/index.php/actualites/droit-tech-fintech/1227-uemoa-fintech-la-bceao-fixe-le-30-juin-comme-date-dintegration-obligatoire-de-tous-les-etablissements-financiers-a-la-plateforme-interoperable-pi-spi",
]

[[changes]]
type = "update"
key = "pay-ci-01"
as_of = 2026-10-15
values.participants = "2026- 23"
reason = "23 institutions authorised to offer PI-SPI services to the public in this country at 31 July 2026, of 104 across the WAEMU. Secondary source: Finances AO, citing the BCEAO list (18 Aug 2026). Primary source: BCEAO communiqué (25 Jun 2026) for the 80 connected participants."
sources = [
  "https://financesao.com/uemoa-pi-spi-atteint-104-etablissements-autorises/",
  "https://www.bceao.int/sites/default/files/2026-06/Communiqu%C3%A9_Prolongation_d%C3%A9lai_Connexion_%C3%A0_PI-SPI-25062026.pdf",
]

