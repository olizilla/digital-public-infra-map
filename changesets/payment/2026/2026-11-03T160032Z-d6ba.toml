[[changes]]
type = "update"
key = "pay-africa-02"
as_of = 2026-10-15
values.participation_rules = "Yes"
reason = "Connection to PI-SPI is mandatory for banks, e-money institutions, payment institutions and microfinance institutions supervised by the WAMU Banking Commission, with membership agreements and technical certification; the BCEAO extended the deadline to 30 September 2026 for banks, e-money and payment institutions and to 30 June 2027 for microfinance institutions. Primary source: BCEAO communiqué (25 Jun 2026). Secondary source: Droit Medias Finance on the BCEAO circular setting the original 30 June 2026 deadline. Updated from the value in the consolidated log."
sources = [
  "https://www.bceao.int/sites/default/files/2026-06/Communiqu%C3%A9_Prolongation_d%C3%A9lai_Connexion_%C3%A0_PI-SPI-25062026.pdf",
]

[[changes]]
type = "update"
key = "pay-africa-02"
as_of = 2026-10-15
values.participants = "2026- 8"
reason = "104 institutions authorised to offer PI-SPI services to the public across the WAEMU at 31 July 2026 (Senegal 24, Côte d'Ivoire 23, Mali 14, Burkina Faso 13, Benin 11, Togo 9, Guinea-Bissau 5, Niger 5), up from 45 at launch. The BCEAO reported 80 connected participants on 24 June 2026. Secondary source: Finances AO, citing the BCEAO list (18 Aug 2026). Primary source: BCEAO communiqué (25 Jun 2026) for the 80 connected participants. Updated from the value in the consolidated log."
sources = [
  "https://financesao.com/uemoa-pi-spi-atteint-104-etablissements-autorises/",
  "https://burkina24.com/?p=418262",
]

[[changes]]
