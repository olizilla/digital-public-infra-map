[[changes]]
type = "update"
key = "pay-gb-02"
as_of = 2026-10-15
values.reporting_forum = "Yes"
reason = "In July 2017 the Bank of England opened RTGS settlement accounts to non-bank payment service providers so they can access Faster Payments and other sterling systems directly, stating the aim of letting them compete on a more level playing field with banks. Primary source: Bank of England (19 Jul 2017)."
sources = [
  "https://www.bankofengland.co.uk/news/2017/july/boe-extends-direct-access-to-rtgs-accounts-to-non-bank-payment-service-providers",
  "https://www.bankofengland.co.uk/payments/access-to-uk-payment-systems-for-non-bank-payment-service-providers",
]

[[changes]]
type = "update"
key = "pay-gb-02"
as_of = 2026-10-15
values.data_handling_rules = "Yes"
reason = "Payment Systems Regulator Specific Direction 20 and the Compliance Data Reporting Standard require Faster Payments PSPs to collate, retain and report APP scams data to Pay.UK. Pay.UK's Faster Payments Service Principles contain no personal data provisions; scheme-level data protection clauses are reported only via a contract-clause aggregator. UK GDPR and the Data Protection Act 2018 apply nationally. Sources: Payment Systems Regulator: Faster Payments APP scams Compliance Data Reporting Standard (Specific Directions 19 and 20) (Primary); Law Insider: Faster Payments agreement clauses on personal data processing under the FPS Rules (Secondary). Personal data clauses in the FPS Rules themselves not verified; Service Principles defer to the FPS Rules, which are not public."
sources = [
  "https://www.psr.org.uk/publications/policy-statements/compliance-data-reporting-standards/",
  "https://www.lawinsider.com/dictionary/fps-rules",
]

