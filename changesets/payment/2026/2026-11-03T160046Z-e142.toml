[[changes]]
type = "update"
key = "pay-gb-02"
as_of = 2026-10-15
values.participation_rules = "Yes"
reason = "Direct settling participants must be authorised PSPs under the Payment Services Regulations 2017, hold Bank of England settlement access, hold a sort code, and comply with FPS Rules and assurance requirements. Sources: Pay.UK, Faster Payments Service Principles v7.6 (Jan 2023): access options and requirements, payment types, DNS three times daily with prefunded accounts, sterling only, customer charges competitive (Primary)."
sources = [
  "https://www.wearepay.uk/wp-content/uploads/2023/02/Pay.UK-Faster-Payments-Service-Principles.pdf",
]

