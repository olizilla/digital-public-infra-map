[[changes]]
type = "update"
key = "pay-gb-02"
as_of = 2026-10-15
values.transaction_types = "P2P, B2B"
reason = "Customers can pay a bill, a business or another person; payment types are single immediate, standing order and forward-dated payments, with batch input for businesses. Sources: Pay.UK, Faster Payments Service Principles v7.6 (Jan 2023): access options and requirements, payment types, DNS three times daily with prefunded accounts, sterling only, customer charges competitive (Primary); Northey Point (2026): four FPS transaction types; forward-dated payments used extensively for business payments (Secondary)."
sources = [
  "https://www.wearepay.uk/wp-content/uploads/2026/02/Annual-Statistics-2025-v1.3.pdf",
]

[[changes]]
type = "update"
key = "pay-gb-02"
as_of = 2026-10-15
values.clearing_infrastructure = "Switch"
reason = "Pay.UK operates the central infrastructure; net sender caps collateralised at the Bank of England. Sources: World Bank, Settlement Models in Fast Payment Systems (2023; 2021 data) (Secondary (multilateral))."
sources = [
  "https://fastpayments.worldbank.org/sites/default/files/2023-05/Settlement%20Note_Final_April%2020.pdf",
]

