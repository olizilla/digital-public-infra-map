[[changes]]
type = "create"
key = "pay-ro-02"
as_of = 2026-10-15
values.country = "Romania"
values.name = "Plăți Instant"
reason = "Replaces TIPS, the Eurosystem service, which was named in error. Romania's instant payment service in lei is the instant component of SENT, run by Transfond, live since 2019. Primary source: Transfond, Instant Payments service page: operated by Transfond, settlement ensured by BNR, 24/7, payments below RON 50,000; AliasPay phone-number payments since 2020; Transfond, SENT system rules v28 (from 1 Feb 2026): instant component CPI Lei runs 24/7/365; participants may include credit institutions, payment institutions, e-money institutions, BNR and the State Treasury; transactions cleared in real time against reserved positions, net positions settled in ReGIS against guarantee funds blocked in ReGIS; personal data processing agreement (Annex 2C)."
sources = [
  "https://www.platiinstant.ro/en/the-service",
  "https://www.transfond.ro/pdf/Reguli_SENT%20v28r00.pdf",
]

