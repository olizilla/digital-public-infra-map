[[changes]]
type = "update"
key = "pay-hu-02"
as_of = 2026-10-15
values.data_handling_rules = "Yes"
reason = "System-specific central bank rules: MNB Decree 35/2017 governs the central database of account holder names, IBANs and secondary account identifiers (mobile number, email, tax ID) used for instant payments, operated by GIRO, including registration, consent and deletion; GIRO publishes a data handling section in its secondary identifier specification. Primary source: MNB Decree 35/2017 on the execution of payment transactions (National Legislation Database): central database of account holder name, IBAN and secondary account identifiers for instant payments; GIRO Zrt: secondary account identifier specification, including data handling section (operator of the central database)."
sources = [
  "https://njt.jog.gov.hu/jogszabaly/2017-35-20-2C",
  "https://giro.hu/api/documents/390",
]

[[changes]]
type = "update"
key = "pay-hu-02"
as_of = 2026-10-15
values.reporting_forum = "No"
reason = "No forum connected to AFR found. Users must first complain to their own payment service provider; if rejected, they can escalate to the MNB Financial Arbitration Board or MNB Consumer Protection Centre under general financial consumer rules. GIRO also runs a real-time fraud monitoring system serving participants, not users. Primary source: MNB consumer request form: payment service complaints must first be lodged with the provider before escalation to the MNB; MNB Decree 28/2014 on complaint handling (National Legislation Database): providers must inform rejected complainants of the Financial Arbitration Board and MNB Consumer Protection Centre; MNB Payment System Report 2024: real-time fraud monitoring system at GIRO, immediate blocking of affected accounts."
sources = [
  "https://mnb.hu/letoltes/fogyasztoi-kerelem-az-mnbhez-20180904.pdf",
  "https://njt.jog.gov.hu/jogszabaly/2014-28-20-2C",
  "https://mnb.hu/letoltes/1-fizetesi-rendszer-jelentes-2024-tovabb-fejlodik-a-hazai-penzforgalom-indul-a-qvik.pdf",
]

