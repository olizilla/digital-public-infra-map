[[changes]]
type = "update"
key = "pay-hu-02"
as_of = 2026-10-15
values.nonbank_participation = "Yes"
reason = "Payment institutions, e-money institutions, Posta and the Hungarian State Treasury can participate. Non-banks can be direct participants: Wise became a direct participant in September 2020 with an MNB settlement account, connecting to VIBER and GIROInstant. Others, such as Barion, participate indirectly through an account at a direct participant; no source found showing Barion has direct access. Primary source: GIRO BKR rules (effective 1 September 2024): direct participants (clearing members) and indirect participants; Wise press release (16 September 2020): MNB settlement account, direct participant in VIBER and GIROInstant; GIROInstant request-to-pay rulebook v2.1 (GIRO document): payment service providers include credit institutions, e-money institutions, Posta, payment institutions, MNB and State Treasury; Hungarian Tax Authority (NAV): State Treasury joined AFR. No public GIRO participant list found."
sources = [
  "https://giro.hu/api/documents/323",
  "https://newsroom.wise.com/en-CEU/216923-wise-announces-its-first-direct-access-integration-in-the-eu-gets-settlement-account-with-the-central-bank-of-hungary/",
  "https://fintechzone.hu/wp-content/uploads/2018/11/Fizet%C3%A9si-k%C3%A9relem-szab%C3%A1lyk%C3%B6nyv_v2.1.pdf",
  "https://nav.gov.hu/ugyfeliranytu/szamlaszamok/Tajekoztatas_Azonnal_20200227",
]

