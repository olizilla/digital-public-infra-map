[[changes]]
type = "update"
key = "pay-pl-02"
as_of = 2026-10-15
values.settlement_method = "Gross"
reason = "Each payment is settled individually and immediately against funds prefunded in KIR's trust account at NBP (SORBNET2, now SORBNET3); only payments covered by those funds can be executed. Primary source: KIR, Express Elixir system rules (Regulamin) v1.7, in force from 1 Mar 2023: participants are payment service providers with an NBP account; payments settled individually against a prefunded KIR trust account in SORBNET2; 24/7/365; PLN only; limits PLN 100,000 (PLN 250,000 for tax payments); instant transfer and phone-number transfer services; personal data chapter (§§ 43-50); KIR, governance and PFMI disclosure report (Feb 2023): shareholders are NBP, commercial banks and the Polish Bank Association (ZBP); Express Elixir uses a deposit (prefunded) settlement model; KIR, General principles and criteria for access to KIR payment systems (2026): Express Elixir participants must be payment service providers and settlement system participants under the 2001 act, hold an NBP account in SORBNET3 and Ognivo status."
sources = [
  "https://www.kir.pl/storage/file/core_files/2023/6/20/a90eee368a6ff8c9e2529098950d844b/Regulamin%20systemu%20Express%20Elixir%20v1.7.pdf",
