[[changes]]
type = "create"
key = "pay-pl-02"
as_of = 2026-10-15
values.country = "Poland"
values.name = "Express Elixir"
reason = "New row for Poland's national instant payment system (replaces the TIPS entry, removal logged separately). Express Elixir is run by KIR (Krajowa Izba Rozliczeniowa). Primary source: KIR, Express Elixir system rules (Regulamin) v1.7, in force from 1 Mar 2023: participants are payment service providers with an NBP account; payments settled individually against a prefunded KIR trust account in SORBNET2; 24/7/365; PLN only; limits PLN 100,000 (PLN 250,000 for tax payments); instant transfer and phone-number transfer services; personal data chapter (§§ 43-50); NBP, Information on interbank clearing and settlement in Q2 2025: 160.83 million Express Elixir payments worth PLN 79.31 billion (Q1 2025: 144.51 million, PLN 72.21 billion); 22 banks including NBP; phone-number (BLIK) P2P payments 81.9% of transactions."
sources = [
  "https://www.kir.pl/storage/file/core_files/2023/6/20/a90eee368a6ff8c9e2529098950d844b/Regulamin%20systemu%20Express%20Elixir%20v1.7.pdf",
  "https://nbp.pl/wp-content/uploads/2025/11/Informacja-o-rozliczeniach-i-rozrachunkach-miedzybankowych-w-II-kw.-2025.pdf",
]

