key = "pay-la-01"
as_of = 2026-10-15
values.bank_participation = "Yes"
reason = "LAPNet lists 24 commercial bank members; 13 offer interbank ATM transfers. Primary source: LAPNet (operator) (2026). Secondary source: Greater Mekong Subregion portal (2025-01); World Bank (n.d.)."
sources = [
  "https://www.lapnet.com.la/",
  "https://greatermekong.org/g/laos-viet-nam-launch-cross-border-qr-code-payment-system",
  "https://documents1.worldbank.org/curated/en/099745004122238218/pdf/P17208907873640020aeb007b4553342298.pdf",
]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.nonbank_participation = "Yes"
reason = "LAPNet lists 2 participating fintechs; MmoneyX (Lao Mobile Money) joined in July 2025 for transfers and settlement with banks. Primary source: LAPNet (operator) (2026). Secondary source: Greater Mekong Subregion portal (2025-01)."
sources = [
  "https://www.lapnet.com.la/",
  "https://greatermekong.org/g/laos-viet-nam-launch-cross-border-qr-code-payment-system",
]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.participation_rules = "Yes"
reason = "Law on Payment System (Amended) No. 45/NA sets the member categories of retail payment systems (commercial banks, microfinance institutions and authorised non-bank payment service providers, Art. 10) and requires operators to define membership requirements, rights, duties, suspension and termination (Art. 28(3)). LAPNet's own member rules are not published. Secondary source: RegAlert, English text of the law."
sources = [
  "https://regalert.today/document/law-on-payment-system-amended-737af38b-f653-407e-ba64-25c36dd86a30/text",
]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.participants = "2026- 26"
reason = "LAPNet homepage lists 24 commercial banks and 2 fintechs as members (checked on the live site during review). BCEL page naming 14 members reflects the older ATM network. Primary source: LAPNet (operator) (2026). Secondary source: Fintech News Singapore (2023)."
sources = [
  "https://www.lapnet.com.la/",
  "https://fintechnews.sg/68354/laos/laos-fintech-revolution-is-still-bank-led-for-now/",
]

