[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.name = "LMPS (LAPNet mobile interbank payment system)"
reason = "Missing from dataset; LAPNet names its mobile interbank payment system LMPS and extends it to QR payments. BOT/BOL release confirms LAPNet as operator of the Lao instant payment system. Lao QR is the QR standard, not the system name. Primary source: LAPNet (operator) (2026). Secondary source: Jclao (news) (2020)."
sources = [
  "https://www.lapnet.com.la/product/lapnet-crossborder-qrpay",
  "https://jclao.com/laos-banks-linked-for-money-transfers-via-mobile-app/",
]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.url = "https://www.lapnet.com.la/"
reason = "New webpage. Operator's official website. Primary source: LAPNet (operator) (2026)."

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.realtime_active = "Yes"
reason = "LMPS is implemented and processes mobile interbank transfers in real time. Q1 value No reflected the absence of a listed system."
sources = [
  "https://www.lapnet.com.la/",
]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.system_type = "Cross-domain"
reason = "Members are commercial banks and 2 fintechs; MmoneyX became the first e-wallet to join in July 2025. Primary source: LAPNet (operator) (2026). Secondary source: Greater Mekong Subregion portal (2025-01)."
sources = [
  "https://www.lapnet.com.la/",
  "https://greatermekong.org/g/laos-viet-nam-launch-cross-border-qr-code-payment-system",
]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.status = "Implemented"
reason = "Live; interbank mobile transfers via LAPNet since 2020 and cross-border linkages since 2024. Primary source: Bank of Thailand and Bank of the Lao PDR (2024-04). Secondary source: Jclao (news) (2020)."
sources = [
  "https://www.bot.or.th/en/news-and-media/news/news-20240403.html",
  "https://jclao.com/laos-banks-linked-for-money-transfers-via-mobile-app/",
]

