  "https://www.lapnet.com.la/",
]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.cross_border = "Yes"
reason = "LAPNet reports QR linkages with Cambodia (2023), Thailand (2024), China via UnionPay (2024) and Vietnam (2025). Primary source: LAPNet (operator) (2026). Secondary source: Greater Mekong Subregion portal (2025-01)."
sources = [
  "https://www.lapnet.com.la/product/lapnet-crossborder-qrpay",
  "https://greatermekong.org/g/laos-viet-nam-launch-cross-border-qr-code-payment-system",
]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-11-06
values.interoperability_policy = "Yes"
reason = "The Law on Payment System (Amended) No. 45/NA (in force 15 January 2024) admits authorised non-bank payment service providers as members of retail payment systems (Art. 10) and requires them to connect with other payment systems in Laos as a licensing condition (Art. 32(2.3)). Source: Law on Payment System (Amended) No. 45/NA, English text via RegAlert."
sources = [
  "https://regalert.today/document/law-on-payment-system-amended-737af38b-f653-407e-ba64-25c36dd86a30/text",
]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.transaction_types = "P2P, P2M"
reason = "Account transfers and Lao QR merchant payments; no evidence found for B2B. Primary source: Lao News Agency (KPL), state news agency (2025-07). Secondary source: Jclao (news) (2020)."
sources = [
  "https://kpl.gov.la/en/detail.aspx?id=92282",
  "https://jclao.com/laos-banks-linked-for-money-transfers-via-mobile-app/",
]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.clearing_infrastructure = "Switch"
reason = "LMPS is LAPNet's own switching hub linking participant banks' mobile banking apps for interbank transfers. Primary source: LAPNet (operator) (2026). Secondary source: World Bank (2022-06)."
sources = [
  "https://www.lapnet.com.la/product/lapnet-crossborder-qrpay",
  "https://documents1.worldbank.org/curated/en/099445010192229771/pdf/P177067071faad02c0b7ec0ec39157cfae9.pdf",
]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.settlement_method = "DNS"
reason = "LAPNet settles net positions daily on T+1 in LaPASS, the RTGS of the Bank of the Lao PDR (final settlement location recorded here per decision rule 8). Secondary source: World Bank (2022-06). No primary source for the settlement arrangement and the World Bank report dates from 2022; confirm the cycle is still T+1."
sources = [
  "https://documents1.worldbank.org/curated/en/099445010192229771/pdf/P177067071faad02c0b7ec0ec39157cfae9.pdf",
]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-10-15
values.operator = "Bank association/Central bank"
reason = "LAPNet is a company owned by commercial banks (60%), the Bank of the Lao PDR (25%) and UnionPay International (15%), and operates under BOL supervision."
sources = [
  "https://www.lapnet.com.la/product/fund-transfer-interbank",
  "https://jclao.com/laos-banks-linked-for-money-transfers-via-mobile-app/",
]

[[changes]]
