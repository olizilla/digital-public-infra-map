]

[[changes]]
type = "update"
key = "pay-la-01"
as_of = 2026-11-06
values.reporting_forum = "No"
reason = "No reporting forum specific to LMPS. Under the Decree on Financial Consumer Protection No. 225/GOV (April 2020), customers complain to their provider first and may then refer the dispute to the Bank of the Lao PDR's consumer protection department; this route covers the financial sector generally. Source: Tilleke & Gibbins summary of the decree."
sources = [
  "https://www.tilleke.com/insights/decree-on-consumer-protection-in-the-financial-sector-in-laos/",
]

