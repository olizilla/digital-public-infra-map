key = "pay-pe-03"
as_of = 2026-10-15
values.settlement_method = "DNS"
reason = "One clearing process and one settlement process per business day; participants prefund specific-resources accounts twice daily to back transfers between settlements (decision rule 4). Final settlement location: BCRP LBTR. Primary source: BCRP (n.d.)."
sources = [
  "https://www.bcrp.gob.pe/sistema-de-pagos/camara-de-compensacion-electronica.html",
]

