as_of = 2026-10-15
values.clearing_infrastructure = "ACH"
reason = "The CCE is Peru's electronic clearing house; it clears immediate transfers and sends results to the BCRP for settlement in the LBTR. Primary source: BCRP (n.d.); BCRP (n.d.)."
sources = [
  "https://www.bcrp.gob.pe/sistema-de-pagos/camara-de-compensacion-electronica.html",
