[[changes]]
type = "update"
key = "pay-pe-03"
as_of = 2026-10-15
values.data_handling_rules = "Yes"
reason = "Circular No. 0022-2025-BCRP, dated 5 December 2025, approves a new General Regulation of the National Payment System. It covers payment infrastructures such as the CCE and the entities that provide payment services, and it refers to the integrity and confidentiality of payment services."
sources = [
  "https://www.bcrp.gob.pe/docs/Transparencia/Normas-Legales/Circulares/2025/circular-0022-2025-bcrp.pdf",
]

[[changes]]
type = "update"
key = "pay-pe-03"
as_of = 2026-10-15
values.reporting_forum = "No"
reason = "Users can complain through their institution's user service platform under SBS Resolution 3274-2017, and escalate to the SBS and INDECOPI. That route is general financial consumer protection, not specific to the CCE. The SBS Market Conduct Regulation (Resolución SBS N° 3274-2017) requires financial institutions to handle users' complaints diligently. Each institution has a user service platform (Plataforma de Atención al Usuario) for this."
sources = [
  "https://www.bn.com.pe/transparenciabn/transparencia-financiera/Res-SBS-3274-2017-Reglamento-Gestion-Conducta-Mercado.pdf",
]

[[changes]]
type = "update"
key = "pay-pe-03"
as_of = 2026-10-15
values.aml_law = "Yes"
reason = "Law No. 27693 created Peru's Financial Intelligence Unit (UIF-Perú) to receive, analyse and pass on information to detect money laundering and terrorist financing. The UIF is now a specialised unit of the banking regulator, the SBS."
sources = [
  "https://www.icnl.org/wp-content/uploads/Ley27693.pdf",
]

[[changes]]
type = "update"
key = "pay-pe-03"
as_of = 2026-10-15
values.transaction_cost = "Variable, free up to S/ 500 (US$ 140) at most entities"
reason = "CCE states transfers are free up to S/ 500 or US$ 140 at most entities; participant fees apply above that. Primary source: CCE (operator) (2023). Source dates from 2023; confirm current threshold."
sources = [
  "https://transferenciasinterbancarias.pe/",
]

[[changes]]
type = "update"
key = "pay-pe-03"
as_of = 2026-10-15
values.qr_code = "Yes"
reason = "QR interoperability is mandated by the BCRP (Circular 0024-2022-BCRP, Art. 11) and runs through the CCE: the CCE built the reader for existing Yape and Plin QR codes, new codes follow an interoperable format, and interoperable QR payments are sent to the CCE for clearing between institutions. Payments within one wallet (e.g. Yape to Yape) stay on that wallet. Secondary sources: El Comercio (15 Sep 2023), quoting the CCE general manager; TAYPI (29 Mar 2026). BCRP primary pages could not be reached; add a BCRP or CCE source before publication."
sources = [
  "https://elcomercio.pe/economia/interoperabilidad-en-el-peru-en-marcha-cuantas-transacciones-se-hicieron-y-como-funcionara-el-qr-entre-billeteras-digitales-yape-plin-qr-cce-depositos-pagos-noticia/",
  "https://taypi.pe/blog/como-funciona-interoperabilidad-qr-bcrp/",
  "https://busquedas.elperuano.pe/normaslegales/aprueban-el-reglamento-de-interoperabilidad-de-los-servicios-circular-n-0024-2022-bcrp-2113366-1/",
]
