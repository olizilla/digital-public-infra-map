values.annual_value_usd = "Not Found"
reason = "Searched: SNB SIC reports combine IP with other retail payments; the SNB annual report 2025 (section 4.2, p. 77) may give a 2025 IP figure but could not be accessed. Primary source: SNB, Report on the SIC system and Disclosure Report 2024 (Sep 2025): IP service settled gross in real time in central bank money from a separate IP settlement account, round the clock, within ten seconds; SNB is system manager; around 60 banks able to receive at end 2024; all active participants must be able to receive by end 2026; SNB speech (10 Apr 2025): CHF 20,000 limit per transaction; receiving mandatory for all banks and fintechs with customer payments from end 2026; SNB does not set fees; prices partly still high. Check SNB annual report 2025 p. 77."
sources = [
