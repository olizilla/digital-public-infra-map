values.interoperability_policy = "Yes"
reason = "Under amendments to the Law on Payment Services, all SEP participants, banks and non-bank payment service providers alike, must offer instant credit transfers to their clients from 1 April 2026. Sources: National Bank of Ukraine; Ukrainian News (January 2026)."
