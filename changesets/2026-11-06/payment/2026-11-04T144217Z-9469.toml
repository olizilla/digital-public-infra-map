key = "pay-ua-02"
as_of = 2026-10-15
values.url = "https://bank.gov.ua/en/payments/ips"
reason = "National Bank of Ukraine's official page for SEP instant transfers."
sources = [
  "https://bank.gov.ua/en/payments/ips",
]

[[changes]]
