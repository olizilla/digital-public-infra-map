[[changes]]
type = "create"
key = "pay-ua-02"
as_of = 2026-10-15
values.country = "Ukraine"
values.name = "SEP instant credit transfers (System of Electronic Payments of the NBU)"
reason = "Added: instant credit transfers in the National Bank of Ukraine's System of Electronic Payments (SEP), live since December 2024. Replaces the TIPS entry. Source: National Bank of Ukraine."
sources = [
  "https://bank.gov.ua/en/payments/ips",
  "https://ukranews.com/en/news/1050659-sep-4-1-with-instant-transfer-functionality-launched-in-december-nbu",
]

[[changes]]
