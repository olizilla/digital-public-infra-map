key = "pay-ua-02"
as_of = 2026-10-15
values.status = "Implemented"
reason = "Launched on 1 December 2024 with 10 banks. Sources: National Bank of Ukraine; Ukrainian News (December 2024)."
sources = [
  "https://bank.gov.ua/en/payments/ips",
  "https://ukranews.com/en/news/1050659-sep-4-1-with-instant-transfer-functionality-launched-in-december-nbu",
]

[[changes]]
