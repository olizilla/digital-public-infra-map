values.system_type = "Interbank"
reason = "Instant UAH credit transfers between accounts at SEP participants (banks, the State Treasury and non-bank providers through banks); no mobile money, card network or CBDC is connected. Source: National Bank of Ukraine."
sources = [
  "https://bank.gov.ua/en/payments/ips",
  "https://ukranews.com/en/news/1128373-number-of-payments-via-sep-increases-by-almost-quarter-to-595-million-in-2025",
]

[[changes]]
