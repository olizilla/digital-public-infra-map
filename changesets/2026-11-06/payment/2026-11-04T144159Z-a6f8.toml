as_of = 2026-10-15
values.status = "Planned/Piloted"
reason = "Proof of concept completed in February 2025; a pilot is in preparation across CARICOM central banks, with no launch date announced. Sources: Global Finance (October 2026); La Caribeña News (September 2026)."
sources = [
  "https://www.centralbank.org.bz/detail-pages/news/2026/05/22/central-bank-of-belize-hosts-the-66th-bi-annual-meeting-of-caricom-governors",
