[[changes]]
type = "create"
key = "pay-lac-04"
as_of = 2026-10-15
values.country = "Latin America and the Caribbean"
values.name = "CAPSS (CARICOM Payment and Settlement System)"
reason = "Added: CAPSS (CARICOM Payment and Settlement System), a planned regional system for cross-border payments between CARICOM countries, settled in local currencies without passing through US dollars. Being developed by CARICOM central banks with Afreximbank and PAPSS. Sources: Central Bank of Belize (May 2026); Global Finance (October 2026)."
sources = [
  "https://www.centralbank.org.bz/detail-pages/news/2026/05/22/central-bank-of-belize-hosts-the-66th-bi-annual-meeting-of-caricom-governors",
]

[[changes]]
type = "update"
