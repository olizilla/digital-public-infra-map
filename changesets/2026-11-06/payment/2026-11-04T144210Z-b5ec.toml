key = "pay-pl-02"
as_of = 2026-10-15
values.annual_volume = "2025- 636 M"
reason = "636.08 million transactions in 2025, up 21% on 2024 (526.91 million). Sources: GSMONLINE (January 2026), reporting KIR data; NBP (2025)."
sources = [
  "https://gsmonline.pl/artykuly/elixir-w-2025-r-przetworzyl-224-mld-transakcji-na-kwote-957-bln-zl",
  "https://nbp.pl/wp-content/uploads/2025/11/Informacja-o-rozliczeniach-i-rozrachunkach-miedzybankowych-w-II-kw.-2025.pdf",
]

[[changes]]
type = "update"
key = "pay-pl-02"
as_of = 2026-10-15
values.data_handling_rules = "Yes"
reason = "The system rules contain a personal data chapter (§§ 43-50): KIR processes personal data on behalf of participants under GDPR Article 28, breaches are reported within 36 hours and archived data is deleted after five years. Source: KIR, Express Elixir system rules v1.7 (March 2023)."
sources = [
  "https://www.kir.pl/storage/file/core_files/2023/6/20/a90eee368a6ff8c9e2529098950d844b/Regulamin%20systemu%20Express%20Elixir%20v1.7.pdf",
]

[[changes]]
type = "update"
key = "pay-pl-02"
as_of = 2026-10-15
values.reporting_forum = "Yes"
reason = "The EU Instant Payments Regulation amended the Settlement Finality Directive so that payment institutions and e-money institutions can participate directly in payment systems from 9 April 2025, with the stated aim of a level playing field between banks and non-bank providers; applies to Poland as an EU member. Secondary source: Worldline (13 Jun 2025). Poland's national transposition and Express Elixir's rules for non-banks not confirmed."
sources = [
  "https://worldline.com/en/home/main-navigation/resources/blogs/2025/settlement-finality-directive-direct-access-to-payment-systems-for-non-bank-psps",
  "https://nbp.pl/wp-content/uploads/2025/11/Informacja-o-rozliczeniach-i-rozrachunkach-miedzybankowych-w-II-kw.-2025.pdf",
]

[[changes]]
type = "update"
key = "pay-pl-02"
as_of = 2026-10-15
values.aml_law = "Yes"
reason = "Poland's AML legislation applies to payment service providers. Source: Act of 1 March 2018 on counteracting money laundering and terrorist financing."
sources = [
  "https://eli.gov.pl/eli/DU/2018/723/ogl/pol/pdf",
]

[[changes]]
type = "update"
key = "pay-pl-02"
as_of = 2026-10-15
values.transaction_cost = "Variable"
reason = "Fees are set by each bank, typically PLN 0 to 5 per instant transfer; some banks offer free transfers online or for the first transfers each month. Source: Bankier (September 2023)."
sources = [
