key = "pay-pl-02"
as_of = 2026-10-15
values.realtime_active = "Yes"
reason = "Operates 24/7/365; payments are settled immediately on receipt. Source: KIR, Express Elixir system rules v1.7 (March 2023)."
sources = [
  "https://www.kir.pl/storage/file/core_files/2023/6/20/a90eee368a6ff8c9e2529098950d844b/Regulamin%20systemu%20Express%20Elixir%20v1.7.pdf",
