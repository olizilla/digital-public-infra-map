values.clearing_infrastructure = "Switch"
reason = "New field. Interoperability runs through the SATIM interbank network, which interconnects 18 banks plus Algérie Poste. Primary source: none found. Secondary source: Algeria Tech News (2026); Eco Times (2025-11). Secondary sources only; confirm the clearing arrangement with GIE Monétique or Bank of Algeria material."
sources = [
  "https://algeriatech.news/?p=34076",
