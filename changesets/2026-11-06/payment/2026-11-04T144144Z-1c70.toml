]

[[changes]]
type = "update"
key = "pay-dz-01"
as_of = 2026-10-15
values.settlement_method = "DNS"
reason = "New field. Interbank retail payments in Algeria are cleared multilaterally and settled net in the Bank of Algeria RTGS (ARTS) on a same-day basis, through ATCI or SATIM's clearing. Final settlement location: ARTS. Primary source: Bank of Algeria, Regulation No. 2005-06 (2005-12). Secondary source: BNP Paribas Cash Management Atlas (n.d.); Fintech Policies (2025). Sources describe retail and card clearing generally; confirm whether DZMobPay positions settle via ATCI or directly from SATIM to ARTS, and the cycle."
sources = [
  "https://www.bank-of-algeria.dz/stoodroa/2021/03/reglement200506.pdf",
  "https://cashmanagement.bnpparibas.com/atlas-countries/algeria",
  "https://fr.fintechpolicies.com/algerie-le-switch-national-de-paiement-satim-enjeux-et-perspectives-pour-linclusion-financiere/",
]

