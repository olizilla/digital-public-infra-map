reason = "The SNB is system manager and SIX Interbank Clearing (a SIX Group subsidiary owned by financial institutions) operates SIC on its behalf. Primary source: SNB, Report on the SIC system and Disclosure Report 2023 (May 2024): SNB system manager, SIX Interbank Clearing operates on its behalf; participants include banks, securities firms, insurers, FMIs, licensed fintechs and cash processors; SNB, Report on the SIC system and Disclosure Report 2024 (Sep 2025): IP service settled gross in real time in central bank money from a separate IP settlement account, round the clock, within ten seconds; SNB is system manager; around 60 banks able to receive at end 2024; all active participants must be able to receive by end 2026."
