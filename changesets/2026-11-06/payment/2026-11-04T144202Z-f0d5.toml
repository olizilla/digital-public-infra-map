values.reporting_forum = "No"
reason = "No forum connected to SIC IP. Users complain to their bank, which must run a complaints process; disputes can go to the Liechtenstein conciliation board for financial services under general rules. Primary source: FMA Liechtenstein Communication 2015/2 on complaint handling (amended 1 Feb 2025): banks and payment institutions must handle complaints and report them annually to the conciliation board; European Commission consumer redress listing: Liechtenstein conciliation board for financial services covers payment accounts and payment services."
sources = [
