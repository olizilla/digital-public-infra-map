values.nonbank_participation = "Yes"
reason = "SIC admits licensed fintechs, securities firms, insurers and other non-banks; the end-2026 receiving obligation covers fintechs with customer payments as well as banks. Primary source: SNB, Instruction sheet on admission to the SIC system (4 Mar 2022): eligible participants include banks, securities firms, fintech licence holders, insurers and FMIs; institutions authorised and supervised by the Liechtenstein FMA treated as domestic; SNB, Report on the SIC system and Disclosure Report 2023 (May 2024): SNB system manager, SIX Interbank Clearing operates on its behalf; participants include banks, securities firms, insurers, FMIs, licensed fintechs and cash processors; SNB speech (10 Apr 2025): CHF 20,000 limit per transaction; receiving mandatory for all banks and fintechs with customer payments from end 2026; SNB does not set fees; prices partly still high. No Liechtenstein non-bank IP participant identified; value describes the system."
