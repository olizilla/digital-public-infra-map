values.bank_participation = "Yes"
reason = "Banks are the main SIC participants; Liechtenstein banks such as LLB and VP Bank receive CHF instant payments. Primary source: SNB, Report on the SIC system and Disclosure Report 2023 (May 2024): SNB system manager, SIX Interbank Clearing operates on its behalf; participants include banks, securities firms, insurers, FMIs, licensed fintechs and cash processors; LLB (Liechtensteinische Landesbank): instant payments available in Switzerland and Liechtenstein since August 2024 on SIC5, 24/7, under ten seconds. Secondary source: Liechtensteiner Vaterland (2 Aug 2024), via Liechtenstein Bankers Association: LLB receiving CHF instant payments from 20 Aug 2024, sending planned spring 2025, receiving free; VP Bank receiving only; LGT receiving CHF by end 2026."
sources = [
