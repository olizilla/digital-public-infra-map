[[changes]]
type = "update"
key = "pay-li-02"
as_of = 2026-10-15
values.cross_border = "Yes"
reason = "SIC IP settles CHF instant payments between participants in Switzerland and Liechtenstein, two countries sharing the Swiss franc; FMA-authorised Liechtenstein institutions participate on the same terms as Swiss ones. No link to other currencies yet; the SNB and ECB are exploring a TIPS link through 2026."
sources = [
  "https://www.snb.ch/en/mmr/reference/sicgiro_access_2022/source/sicgiro_access_2022.en.pdf",
]

[[changes]]
type = "update"
key = "pay-li-02"
as_of = 2026-10-15
values.interoperability_policy = "Yes"
reason = "SNB requires all active SIC participants with customer payments, banks and fintechs, to be able to receive instant payments by end 2026; sending is voluntary."
sources = [
  "https://www.snb.ch/public/asset/en/www-snb-ch/publications/sicsystem-disclosure/sicsystem-disclosure-all/sicsystem_disclosure_2024/publications0_en/sicsystem_disclosure_2024.en.pdf",
]

[[changes]]
type = "update"
key = "pay-li-02"
as_of = 2026-10-15
values.transaction_types = "P2P, P2M, B2B"
reason = "Account-to-account CHF credit transfers for households and companies; no merchant-specific or government-specific product found. Primary source: SNB, Report on the SIC system and Disclosure Report 2024 (Sep 2025): IP service settled gross in real time in central bank money from a separate IP settlement account, round the clock, within ten seconds; SNB is system manager; around 60 banks able to receive at end 2024; all active participants must be able to receive by end 2026; SNB speech (10 Apr 2025): CHF 20,000 limit per transaction; receiving mandatory for all banks and fintechs with customer payments from end 2026; SNB does not set fees; prices partly still high."
sources = [
