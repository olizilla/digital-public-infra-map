[[changes]]
type = "create"
key = "pay-li-02"
as_of = 2026-10-15
values.country = "Liechtenstein"
values.name = "SIC IP (Instant Payments service of the SIC system)"
reason = "New row for the instant payment system used in Liechtenstein; replaces TIPS, the Eurosystem service, which was named in error. Liechtenstein uses the Swiss franc and its banks participate in the SNB's SIC system; SIC IP is the instant service of SIC, launched August 2024. Primary source: SNB, Report on the SIC system and Disclosure Report 2024 (Sep 2025): IP service settled gross in real time in central bank money from a separate IP settlement account, round the clock, within ten seconds; SNB is system manager; around 60 banks able to receive at end 2024; all active participants must be able to receive by end 2026; SNB, Instruction sheet on admission to the SIC system (4 Mar 2022): eligible participants include banks, securities firms, fintech licence holders, insurers and FMIs; institutions authorised and supervised by the Liechtenstein FMA treated as domestic; LLB (Liechtensteinische Landesbank): instant payments available in Switzerland and Liechtenstein since August 2024 on SIC5, 24/7, under ten seconds."
sources = [
  "https://www.bankenverband.li/en/topics/regulation",
  "https://www.snb.ch/en/mmr/reference/sicgiro_access_2022/source/sicgiro_access_2022.en.pdf",
  "https://llb.li/en/business/payments/solutions/instant-payment",
]

