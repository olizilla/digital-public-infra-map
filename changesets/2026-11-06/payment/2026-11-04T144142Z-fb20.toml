values.transaction_types = "P2P, P2M, B2B, Other"
reason = "Supports payments between individuals, QR payments at merchants, business payments and, since 2025, instant payments to state accounts such as taxes and insurance contributions (recorded as Other). Source: Czech National Bank (May 2026)."
sources = [
  "https://www.cnb.cz/en/payments/certis/instant-payments/index.html",
