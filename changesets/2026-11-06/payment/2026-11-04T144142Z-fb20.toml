[[changes]]
type = "update"
key = "pay-cz-02"
as_of = 2026-10-15
values.interoperability_policy = "No"
reason = "Searched: participation in the instant scheme is voluntary, though participants cover about 99% of bank clients. The CNB runs a shared Pay a Contact phone-number register open to all direct participants. Primary source: CNB, Instant payments page: introduced end 2018; processed 24/7 in CERTIS, operated by the CNB; limit CZK 2.5 million; participation voluntary; QR payments; 43.6 million instant payments in June 2026; about 46% of interbank transfers in April 2026; CNB, CERTIS Rules Annex 8, Pay a Contact Register, version 2 (from 2 Feb 2026): CNB-run register linking phone numbers to accounts; GDPR controllers (Art. 11); consent, expiry and deletion rules. Team to decide whether the CNB-run shared alias register counts as an interoperability policy."
sources = [
  "https://www.cnb.cz/en/payments/certis/instant-payments/index.html",
  "https://www.cnb.cz/export/sites/cnb/en/payments/.galleries/certis/download/CERTIS_rules_annex_08.pdf",
]

[[changes]]
type = "update"
key = "pay-cz-02"
as_of = 2026-10-15
values.transaction_types = "P2P, P2M, B2B, Other"
reason = "Payments between individuals, QR payments at merchants, business payments, and instant payments to state accounts at the CNB (taxes, insurance contributions) since 2025. Primary source: CNB, Instant payments page: introduced end 2018; processed 24/7 in CERTIS, operated by the CNB; limit CZK 2.5 million; participation voluntary; QR payments; 43.6 million instant payments in June 2026; about 46% of interbank transfers in April 2026; CNB press release (27 May 2026): 40.8 million instant payments in April 2026; 53% of Czechs use instant payments; 31% have paid by QR code. Secondary source: Finanční správa (Czech Tax Administration), reproducing CNB press release (2025): CNB launched instant payments to state accounts."
sources = [
  "https://www.cnb.cz/en/payments/certis/instant-payments/index.html",
  "https://www.cnb.cz/cs/cnb-news/tiskove-zpravy/Okamzite-platby-u-Cechu-boduji.-Aktivne-jepouziva-uz-vetsina-populace-99-klientu-je-s-nimi-spokojeno/",
