[[changes]]
type = "create"
key = "pay-cz-02"
as_of = 2026-10-15
values.country = "Czech Republic"
values.name = "CERTIS Instant Payments (Okamžité platby)"
reason = "Replaces TIPS, the Eurosystem service, which was named in error. Czech instant payments run as a scheme within CERTIS, the CNB's interbank payment system, since November 2018. Primary source: CNB, Instant payments page: introduced end 2018; processed 24/7 in CERTIS, operated by the CNB; limit CZK 2.5 million; participation voluntary; QR payments; 43.6 million instant payments in June 2026; about 46% of interbank transfers in April 2026; CNB Working Paper 4/2025, Instant Payments in Czechia: launched November 2018; CERTIS RTGS; 14 banks in 2024; CERTIS fee CZK 0.11 per instant payment; phone-number payments; 50% of retail payments instant in 2024."
sources = [
  "https://www.cnb.cz/en/payments/certis/instant-payments/index.html",
  "https://www.cnb.cz/export/sites/cnb/en/economic-research/.galleries/research_publications/cnb_wp/cnbwp_2025_04.pdf",
]

