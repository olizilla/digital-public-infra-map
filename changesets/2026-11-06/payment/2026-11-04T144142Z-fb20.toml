values.country = "Czech Republic"
values.name = "CERTIS Instant Payments (Okamžité platby)"
reason = "Added: Czech instant payments, run as a scheme within CERTIS, the Czech National Bank's interbank payment system, since November 2018. Replaces the TIPS entry. Source: Czech National Bank."
sources = [
  "https://www.cnb.cz/en/payments/certis/instant-payments/index.html",
  "https://www.cnb.cz/export/sites/cnb/en/economic-research/.galleries/research_publications/cnb_wp/cnbwp_2025_04.pdf",
]

