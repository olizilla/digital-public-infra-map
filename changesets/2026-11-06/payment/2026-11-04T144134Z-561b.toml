[[changes]]
type = "update"
key = "pay-bb-01"
as_of = 2026-10-15
values.clearing_infrastructure = "RTGS"
reason = "BiMPay is operated by the Central Bank of Barbados, which processes payments directly; it replaced the ACH and RTP systems. Primary source: Central Bank of Barbados (2026-06); Central Bank of Barbados (2026-06)"
sources = [
  "https://www.centralbank.org.bb/news/bimpay-news/bimpay-goes-live-on-june-12-marking-new-era-in-payments",
]

[[changes]]
type = "update"
key = "pay-bb-01"
as_of = 2026-10-15
values.settlement_method = "Gross"
reason = "Direct participants hold settlement accounts within BiMPay and payments settle in seconds, 24/7. Primary source: Central Bank of Barbados (2026); Central Bank of Barbados (2026-06). Secondary source: Caribbean360 (2026-06). Evidence is indirect: Central Bank material describes settlement partly from the user's side. Confirm individual interbank settlement against BiMPay operating rules or technical documentation."
sources = [
  "https://www.centralbank.org.bb/news/bimpay-news/bimpay-goes-live-on-june-12-marking-new-era-in-payments",
]

