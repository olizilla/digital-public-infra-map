]

[[changes]]
type = "update"
key = "pay-hu-02"
as_of = 2026-10-15
values.qr_code = "Yes"
reason = "qvik QR code payments have run on the instant payment system since September 2024. Sources: Magyar Nemzeti Bank, Payment Systems Report 2025; Infostart (June 2024)."
sources = [
  "https://www.mnb.hu/letoltes/mnb-payment-systems-report-2025-digital-final.pdf",
