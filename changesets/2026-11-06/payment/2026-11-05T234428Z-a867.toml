[[changes]]
type = "update"
key = "pay-is-01"
as_of = 2026-11-05
values.realtime_active = "No"
reason = "ISK settlement in TIPS is not yet live; the agreement signed on 24 June 2026 takes effect from 2028, with participation targeted for the second half of 2028. No pilot or go-live date announced."
sources = [
  "https://www.ecb.europa.eu/press/pr/date/2026/html/ecb.pr260624_1~ce8e85127f.en.html",
  "https://cb.is/news-and-publications/article/iceland-joins-eurosystems-tips-instant-payment-system",
]

