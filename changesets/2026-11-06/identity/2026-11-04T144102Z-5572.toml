key = "id-af-01"
as_of = 2026-09-16
values.name = "Electronic National Identity Card (e-Tazkira)"
reason = "The national ID is the e-Tazkira, a biometric smart card run by NSIA. Launched May 2018. Over 12.2 million issued by Nov 2024."
sources = [
  "https://www.khaama.com/more-than-800000-electronic-id-cards-distributed-in-afghanistan-during-first-six-months/",
]

